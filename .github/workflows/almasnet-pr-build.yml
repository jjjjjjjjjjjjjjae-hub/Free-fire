name: Temporary AlmasNet Root PR Build

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: almasnet-root-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: cp almasnet-root-app/app/build/outputs/apk/debug/app-debug.apk ./AlmasNetRoot-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlmasNetRoot-debug
          path: AlmasNetRoot-debug.apk
          if-no-files-found: error
